name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.27.4'
          cache: true

      # Generates android/ only if you have not committed it yet.
      - name: Create Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name liteword_studio --org com.litewordstudio .
          fi
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="LiteWord Studio"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk LiteWord-Studio-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteWord-Studio-apk
          path: LiteWord-Studio-*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LiteWord-Studio-*.apk
          generate_release_notes: true
